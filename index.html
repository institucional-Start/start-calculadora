<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2340">
<title>Start Calculadora</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="favicon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --navy-deep:#0d2340;
    --navy:#12335c;
    --navy-light:#1c4a80;
    --blue:#2f7dfa;
    --blue-bright:#4a9bff;
    --ink:#eaf1ff;
    --ink-dim:#a9c0e0;
    --line:rgba(255,255,255,0.12);
    --good:#3ddc97;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(74,155,255,0.18), transparent 60%),
      linear-gradient(180deg, var(--navy-deep) 0%, #081527 100%);
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    accent-color:var(--blue-bright);
    caret-color:var(--blue-bright);
  }

  .wrap{width:100%; max-width:460px; padding-top:28px; padding-bottom:32px;}

  .logo-wrap{display:flex; justify-content:center; margin-bottom:16px; margin-top:8px;}
  .logo-wrap img{height:96px; width:auto; filter:drop-shadow(0 10px 24px rgba(0,0,0,0.4));}

  h1{
    font-size:26px;
    line-height:1.15;
    margin:6px 0 22px;
    font-weight:800;
    letter-spacing:-0.01em;
    text-align:center;
  }
  h1 em{color:var(--blue-bright); font-style:normal;}

  .card{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  }

  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-dim);
    margin-bottom:8px;
    letter-spacing:.01em;
  }
  .field label .opt{
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
    opacity:0.6;
    font-size:12px;
  }
  .input-row{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.05);
    border:1.5px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    transition:border-color .15s ease, background .15s ease;
  }
  .input-row:focus-within{
    border-color:var(--blue-bright);
    background:rgba(74,155,255,0.08);
  }
  .input-row input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:var(--ink);
    font-size:20px;
    font-weight:700;
    padding:14px 4px 14px 16px;
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
    caret-color:var(--blue-bright);
  }
  .input-row input::-webkit-outer-spin-button,
  .input-row input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .input-row input:-webkit-autofill,
  .input-row input:-webkit-autofill:hover,
  .input-row input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink) !important;
    -webkit-box-shadow:0 0 0 1000px transparent inset !important;
    transition:background-color 9999s ease-in-out 0s;
    caret-color:var(--ink);
  }
  .input-row input::placeholder{color:rgba(255,255,255,0.28); font-weight:500;}
  .unit{
    padding:0 16px;
    color:var(--ink-dim);
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
  }
  .unit-left{padding-right:0; padding-left:16px;}
  .input-row .unit-left ~ input{padding-left:6px;}

  /* proportion field: 1 : X layout — centralizado e equilibrado */
  .ratio-row{
    display:flex;
    align-items:stretch;
    justify-content:center;
    height:52px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .ratio-row:focus-within{border-color:var(--blue-bright); background:rgba(74,155,255,0.08);}
  .ratio-fixed,
  .ratio-sep{
    display:flex;
    align-items:center;
    font-size:19px;
    font-weight:700;
    color:var(--ink-dim);
  }
  .ratio-fixed{padding-left:16px;}
  .ratio-sep{padding:0 8px;}
  .ratio-row input{
    display:flex;
    align-items:center;
    width:70px;
    flex:none;
    background:transparent;
    border:0;
    outline:0;
    margin:0;
    padding:0 16px 0 0;
    color:var(--ink);
    font-size:19px;
    font-weight:700;
    font-family:inherit;
    line-height:normal;
    text-align:left;
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
    caret-color:var(--blue-bright);
  }
  .ratio-row input::-webkit-outer-spin-button,
  .ratio-row input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .ratio-row input:-webkit-autofill,
  .ratio-row input:-webkit-autofill:hover,
  .ratio-row input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink) !important;
    -webkit-box-shadow:0 0 0 1000px transparent inset !important;
    transition:background-color 9999s ease-in-out 0s;
    caret-color:var(--ink);
  }

  .quick{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .quick button{
    flex:1;
    min-width:56px;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-size:13px;
    font-weight:700;
    padding:9px 4px;
    border-radius:10px;
    cursor:pointer;
  }
  .quick button:active, .quick button.active{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }

  .calc-btn{
    width:100%;
    margin-top:6px;
    padding:16px;
    border:0;
    border-radius:14px;
    background:linear-gradient(180deg, var(--blue-bright), var(--blue));
    color:#fff;
    font-size:17px;
    font-weight:800;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 12px 24px -8px rgba(47,125,250,0.55);
    -webkit-user-select:none; user-select:none;
  }
  .calc-btn:active{transform:translateY(1px); box-shadow:0 8px 16px -8px rgba(47,125,250,0.5);}

  .result{
    margin-top:18px;
    border-radius:16px;
    background:rgba(61,220,151,0.1);
    border:1px solid rgba(61,220,151,0.35);
    padding:18px;
    display:none;
  }
  .result.show{display:block;}
  .result .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:8px 0;
  }
  .result .row + .row{border-top:1px dashed rgba(255,255,255,0.14);}
  .result .label{font-size:14px; color:var(--ink-dim); font-weight:600;}
  .result .value{font-size:20px; font-weight:800; color:var(--good); font-variant-numeric:tabular-nums;}
  .result .total{font-size:12px; color:var(--ink-dim); margin-top:10px; text-align:center;}

  .err{
    margin-top:14px;
    border-radius:12px;
    background:rgba(255,99,99,0.12);
    border:1px solid rgba(255,99,99,0.35);
    color:#ffb3b3;
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    display:none;
  }
  .err.show{display:block;}

  footer{
    margin-top:22px;
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,0.3);
  }

  @media (max-width:360px){
    h1{font-size:23px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-wrap"><img src="logo.png" alt="Start"></div>
    <h1>Start <em>Calculadora</em></h1>

    <div class="card">
      <div class="field">
        <label for="volume">Volume do Recipiente (ml):</label>
        <div class="input-row">
          <input id="volume" type="number" inputmode="decimal" min="0" step="any" placeholder="Ex: 1000" value="1000" autocomplete="off">
          <span class="unit">ml</span>
        </div>
      </div>

      <div class="field">
        <label for="ratio">Proporção de Diluição (ex. 1:10):</label>
        <div class="ratio-row">
          <span class="ratio-fixed">1</span>
          <span class="ratio-sep">:</span>
          <input id="ratio" type="number" inputmode="decimal" min="0" step="any" placeholder="5" value="5" autocomplete="off">
        </div>
        <div class="quick" id="quickRatios">
          <button type="button" data-v="3">1:3</button>
          <button type="button" data-v="5">1:5</button>
          <button type="button" data-v="10">1:10</button>
          <button type="button" data-v="20">1:20</button>
          <button type="button" data-v="40">1:40</button>
        </div>
      </div>

      <div class="field">
        <label for="preco">Preço por Litro <span class="opt">(opcional)</span></label>
        <div class="input-row">
          <span class="unit unit-left">R$</span>
          <input id="preco" type="number" inputmode="decimal" min="0" step="any" placeholder="Ex: 30,00" autocomplete="off">
        </div>
      </div>

      <button class="calc-btn" id="calcBtn">Calcular</button>

      <div class="err" id="err"></div>

      <div class="result" id="result">
        <div class="row"><span class="label">Produto</span><span class="value" id="rProduto">–</span></div>
        <div class="row"><span class="label">Água</span><span class="value" id="rAgua">–</span></div>
        <div class="row" id="rowPreco" style="display:none;"><span class="label">Custo do produto</span><span class="value" id="rPreco">–</span></div>
        <div class="total" id="rTexto"></div>
      </div>
    </div>

    <footer>Ferramenta de apoio comercial · uso interno</footer>
  </div>

<script>
  const volumeEl = document.getElementById('volume');
  const ratioEl = document.getElementById('ratio');
  const precoEl = document.getElementById('preco');
  const btn = document.getElementById('calcBtn');
  const resultEl = document.getElementById('result');
  const errEl = document.getElementById('err');
  const rProduto = document.getElementById('rProduto');
  const rAgua = document.getElementById('rAgua');
  const rPreco = document.getElementById('rPreco');
  const rowPreco = document.getElementById('rowPreco');
  const rTexto = document.getElementById('rTexto');
  const quickWrap = document.getElementById('quickRatios');

  function fmt(n){
    // format ml nicely: no unnecessary decimals, pt-BR separators
    const rounded = Math.round(n * 100) / 100;
    return rounded.toLocaleString('pt-BR', {maximumFractionDigits:2}) + ' ml';
  }

  function fmtMoney(n){
    return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  }

  function highlightQuick(){
    const val = ratioEl.value;
    [...quickWrap.children].forEach(b=>{
      b.classList.toggle('active', b.dataset.v === val);
    });
  }

  quickWrap.addEventListener('click', (e)=>{
    const b = e.target.closest('button');
    if(!b) return;
    ratioEl.value = b.dataset.v;
    highlightQuick();
    calculate();
  });

  ratioEl.addEventListener('input', highlightQuick);

  function calculate(){
    errEl.classList.remove('show');
    const volume = parseFloat(volumeEl.value);
    const ratio = parseFloat(ratioEl.value);

    if(isNaN(volume) || volume <= 0){
      errEl.textContent = 'Informe um volume de recipiente válido.';
      errEl.classList.add('show');
      resultEl.classList.remove('show');
      return;
    }
    if(isNaN(ratio) || ratio < 0){
      errEl.textContent = 'Informe uma proporção de diluição válida.';
      errEl.classList.add('show');
      resultEl.classList.remove('show');
      return;
    }

    if(ratio === 0){
      errEl.textContent = 'A proporção não pode ser zero.';
      errEl.classList.add('show');
      resultEl.classList.remove('show');
      return;
    }

    // Mesma lógica da calculadora original Vonixx:
    // "1:N" => produto = volume / N  (não volume / (1+N))
    const produto = volume / ratio;
    const agua = volume - produto;

    rProduto.textContent = fmt(produto);
    rAgua.textContent = fmt(agua);
    rTexto.textContent = `Para um recipiente de ${fmt(volume)}, adicione ${fmt(produto)} de produto e ${fmt(agua)} de água.`;

    // Preço diluído (opcional): custo do produto puro usado neste recipiente
    // Ex: R$30/L, produto = 200ml → custo = 30 * (200/1000) = R$6,00
    const precoLitro = parseFloat(precoEl.value);
    if(!isNaN(precoLitro) && precoLitro > 0){
      const custo = precoLitro * (produto / 1000);
      rPreco.textContent = fmtMoney(custo);
      rowPreco.style.display = 'flex';
    } else {
      rowPreco.style.display = 'none';
    }

    resultEl.classList.add('show');
  }

  btn.addEventListener('click', calculate);
  [volumeEl, ratioEl, precoEl].forEach(el=>{
    el.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ el.blur(); calculate(); } });
  });

  // calculate on load with default values
  highlightQuick();
  calculate();

  // basic offline support via service worker (optional, safe no-op if unsupported)
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
